name: Keep-alive y limpieza de imágenes

# Cada 3 días: evita la pausa por inactividad de Supabase Free y borra imágenes huérfanas en Cloudinary.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    steps:
      - name: Invocar media-cleanup
        env:
          URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
          URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
          SECRET_DEV: ${{ secrets.CRON_SECRET_DEV }}
          SECRET_PROD: ${{ secrets.CRON_SECRET_PROD }}
        run: |
          if [ "${{ matrix.target }}" = "dev" ]; then URL="$URL_DEV"; SECRET="$SECRET_DEV"; else URL="$URL_PROD"; SECRET="$SECRET_PROD"; fi
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "Secretos de ${{ matrix.target }} no configurados; se omite."; exit 0; fi
          curl -fsS --max-time 60 -X POST -H "x-cron-secret: $SECRET" "$URL/functions/v1/media-cleanup"
